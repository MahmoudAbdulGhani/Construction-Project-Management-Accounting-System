services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    # Development override: runserver (with auto-reload) instead of the
    # production gunicorn command baked into the Dockerfile. Set
    # COMPOSE_DEV=0 to keep gunicorn, or override with
    # `docker compose run` for one-off production-like checks.
    command: python manage.py runserver 0.0.0.0:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
